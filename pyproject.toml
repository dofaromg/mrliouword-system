[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mrliouword-agent-sdk"
version = "1.0.1"
description = "Mrliouword Agent SDK - 智能 AI Agent 開發套件"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mrliou", email = "contact@mrliou.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["ai", "agent", "sdk", "claude", "anthropic", "mrliouword"]
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mrliouword = "mrliouword_agents.cli.main:cli"

[project.urls]
Homepage = "https://github.com/dofaromg/mrliouword-system"
Documentation = "https://github.com/dofaromg/mrliouword-system/docs"
Repository = "https://github.com/dofaromg/mrliouword-system"
"Bug Tracker" = "https://github.com/dofaromg/mrliouword-system/issues"

# 套件探索範圍。先前這份設定只存在於 setup.py 的 find_packages()，
# pyproject 沒有對應宣告，因此無法移除 setup.py——flat-layout 下
# auto-discovery 會因為有四個頂層套件而失敗，或誤把 tests/examples 打包進去。
[tool.setuptools.packages.find]
include = ["mrliouword_agents*", "integrations*"]
exclude = ["tests*", "examples*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'

