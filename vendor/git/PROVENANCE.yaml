verification:
  performed:
    - 依賴查驗：50 個建置檔／腳本、GitHub workflows、Python/JS/TS、release_gate 基準線、Merkle 葉、自有文件的路徑引用——對這 410 檔的硬依賴為 0
    - 兩次暫存副本預演（範圍 1 的 359 檔、範圍 2 的 410 檔）：七支閘門全 exit 0；release_gate 產物 15／全過 4／未過 11／基準線 70 不變；Merkle root 相同、12 葉不變
    - 正式搬移：git diff --cached -M100% 判定 410 檔全部 R100
    - 血緣判定（初版）：359 個 C 檔以 mrl_/mrliou 全文比對命中 0；非 C 檔逐檔以匯入 commit 與內容判定
    - 血緣判定（更正，PR #83 Codex 審閱後）：字串比對對「本地寫的、但不提 MRL 的程式碼」是假陰性。改為 410 檔逐一 git log --follow，找出 0663a34 以外的所有 commit——結果：409 檔另有三個根 commit 的平行新增（見 parallel_additions）、3 檔有本地修改（見 transformation）
    - auth.c 搬到 mrliou/（2026-09-24）：搬移前 sha256 與 MANIFEST 記錄一致；git mv 後 git 判定 R100、sha256 不變；mrliou/Makefile 的 SRCS 為明列清單不含 auth.c；以暫存副本加入 auth.c 後 make -n 輸出中 auth 出現 0 次；倉庫內 workflow／建置檔無編 Git 樹者
    - 欄位比對（2026-09-24，擁有者指出後）：十個必要欄位逐一對照政策第 4 節；derivative_role 只用列舉值；artifact_owner 與其他兩份 PROVENANCE 一致
  not_performed:
    - 上游 Git 版本識別（倉庫內無 GIT-VERSION-GEN、RelNotes、版本字串）
    - 與上游任一 release 的逐檔 sha256 比對（需網路取得上游 tarball，本環境 egress 不允許）
  note: 因此 verification_status 為 partial；version 記為 undetermined，不猜。
