schema: MRL_System_MrliouAI_Naming_Registry/v1
status: canonical
root_authority: MrLiouWord
origin_signature: MrLiouWord

canonical:
  system:
    id: MRL_System
    display_name: MRL 系統
    repository: mrliouword-system
  product:
    id: MrliouAI
    display_name: MrliouAI
    public_domain: mrliouword.com
  web_platform:
    id: MrliouAI_Control_Center
    display_name: MrliouAI 控制中心
    service_name: mrliouai-control-center
  api_gateway:
    id: MRL_API_Gateway
    display_name: MRL API Gateway
    service_name: mrl-api-gateway
    public_domain: api.mrliouword.com
  core_service:
    id: MRL_System_Core
    display_name: MRL 系統核心服務
    worker_name: mrl-system-core
  ai_runtime:
    id: MrliouAI_Runtime
    display_name: MrliouAI Runtime
    service_name: mrliouai-runtime
    default_endpoint: http://mrl-runtime:7810
  memory:
    id: MRL_Memory
    display_name: MRL 記憶模組
  files:
    id: MRL_Files
    display_name: MRL 檔案模組
  persona:
    id: MrliouAI_Persona
    display_name: MrliouAI 人格模組
  tools:
    id: MrliouAI_Tools
    display_name: MrliouAI 工具模組
  status:
    id: MRL_System_Status
    display_name: MRL 系統狀態
  audit:
    id: MRL_Audit
    display_name: MRL 審計模組
  identity:
    id: MRL_Identity
    display_name: MRL 身分模組
  storage:
    id: MRL_Storage
    display_name: MRL 儲存模組

  entrypoint:
    id: Mrliou_claude
    display_name: MRL 運行入口
    file: Mrliou_claude.md
    registry_key: mrl_Mrliou_claude
    derivative_role: entrypoint
    adapter: CLAUDE.md
    note: >-
      擁有者 2026-09-21 指示「必須有我的前綴」。CLAUDE.md 是供應商品牌名，
      依 NAMING.md 1.2 不得升格為 canonical，只保留為 adapter；
      依 naming_rules_v1.yaml 的 invariant「Original names are NEVER changed」
      不改名、不刪除。lineage 見 docs/governance/MRL_NAMING_LINEAGE.md。

legacy_aliases:
  mrliouword-private:
    canonical: MRL_System_Core
    disposition: migrate_service_name
  mrl-silly-api:
    canonical: MRL_API_Gateway
    disposition: replace
  particle-api:
    canonical: MRL_API_Gateway
    disposition: quarantine_as_source_name
  particle-edge:
    canonical: MRL_System_Core
    disposition: quarantine_as_source_name
  FlowAgent:
    canonical: MrliouAI
    disposition: preserve_only_in_historical_provenance
  CLAUDE.md:
    canonical: Mrliou_claude
    disposition: adapter
    note: >-
      disposition 用 NAMING.md 1.2 既有的詞 adapter。本倉庫 naming_authority: false，
      若擁有者要換別的處置詞，以擁有者定義為準。
      本檔由 tools/mrliou_claude_sync.py --build 產生，CI 以 --check 擋漂移。

rules:
  - New runtime, API, UI, container, Worker and documentation identifiers MUST use this registry.
  - Legacy aliases MUST NOT be shown as current product or module names.
  - Historical evidence MUST retain original text and be marked as provenance; it MUST NOT be silently rewritten.
  - Cloud provider resource names are implementation identifiers and MUST NOT replace canonical MRL or MrliouAI names.
  - All public responses MUST include origin_signature=MrLiouWord.
