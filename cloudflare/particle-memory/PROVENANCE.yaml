deviation_from_verbatim:
  reason: 原始碼含可用憑證，倉庫為 public 且已有 fork
  policy_basis: >
    命名註冊表規則 3 要求歷史證據保留原文。此處與「不得公開發布憑證」
    直接衝突。取捨方式：原件不入庫，但記錄 sha256 使其仍可逐位元組回驗；
    所有偏離逐項列出，不隱藏。
  changes:
    - id: 1
      what: 移除硬編碼的 DL580_BRIDGE 與 DL580_API_KEY
      to: 一律由 Worker secret 提供，且不設任何預設值
    - id: 2
      what: 同步改為 fail-closed
      to: 必須 bridge、金鑰、DL580_SYNC_ENABLED 三者皆備才啟用
    - id: 3
      what: 未信任欄位在組成 psql 指令前先行驗證
      to: 任一欄位含 shell 元字元即整筆不同步
    - id: 4
      what: 對外回應不再揭露 bridge 位址
      to: /、/health、/stats、/sync/status 改回「由 secret 提供」
    - id: 5
      what: 移除 MRL_syncToDL580 中對 /MRL_pg 的無效前置呼叫
      to: 該呼叫的結果從未被使用，每次同步白白多一次往返

security_findings:
  - id: SEC-1
    severity: critical
    title: POST /store 可經 DL580 同步橋在遠端主機執行任意指令
    detail: >
      使用者送出的 content 逐字嵌入 SQL，整段 SQL 包進 psql -c "..."，
      再以 cmd 查詢參數送往 /MRL_run。轉義僅處理 SQL 單引號與 shell 雙引號；
      $( )、反引號、分號、管線、& 皆未處理。POST /store 對外無任何驗證。
    proof: content 為 "無害的筆記 $(id) 以及 `whoami`" 時兩段原封不動留在雙引號內
    status: 已以修改 3 止血（fail-closed），**非正解**
    real_fix_needs: bridge 提供「SQL 與參數分開傳遞」的端點；屬 DL580 側，不在本倉庫
  - id: SEC-2
    severity: critical
    title: 原始碼硬編碼可用的 API 金鑰
    detail: DL580_API_KEY 與 bridge 位址寫死在原始碼中
    status: 已以修改 1 移除；金鑰未進入本倉庫或其 git 歷史（已查證）
    owner_action_required: 該金鑰已存在於使用者傳遞的 .js 與 PDF 中，建議輪換
  - id: SEC-3
    severity: high
    title: POST /store /update /delete 對外無任何驗證
    detail: 與 particle-api 的 X-Master-Key 機制不同，本模組沒有任何存取控制
    status: 未修改——加上驗證會改變既有呼叫端的契約，需擁有者決定

transformation: >
  自使用者提供的原始封存匯入，移除憑證、同步改為 fail-closed、
  未信任輸入加上驗證。核心記憶邏輯（七層、SimHash64、MemoryVault、
  各端點）未更動。

