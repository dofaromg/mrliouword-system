    - 五種注入載荷實測全數擋下（$( )／反引號／分號／管線／&／換行）
    - 三種正常內容實測全數放行（曾誤擋，見下）
    - simhash64 決定性與相似度實測未受影響
  self_correction: >
    第一版守衛檢查「組好的整串指令」，因 SQL 範本自身含分號與換行而把
    正常內容一起擋掉。實測發現後改為驗證使用者輸入本身。錯誤記在原始碼
    註解中，避免日後改回去。
  not_performed:
