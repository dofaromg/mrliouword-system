  transformation: >
    Route all Channel operations through one Mrliou_ChannelChain actor for the
    existing D1 table. Serialize external awaits, retain D1 as commit authority,
    preserve legacy hash formats, validate existing history before writes,
    condition each append atomically on the committed head to fence delayed I/O, and
    retain a committed receipt when KV projection fails. Add SQLite-backed DO
    binding/migration, pinned tooling, runtime regressions and deployment verifier.
  verification_status: partial
  implements:
    - MRL_CHANNEL_CORE
    - MRL_CHANNEL_CORE/MRL_SyncChannel
    - MRL_RUNTIME_CORE/MRL_RuntimePersistence
  definition_source: registry/mother_core_registry_2026-09-21.json
  ownership_boundary: runtime adapter within MRL_API_Gateway, not a new canonical core
  origin_import: imported_verbatim above; original bytes remain addressable at import_commit
  change_record: docs/retrospective/2026-09-22_channel_single_writer_session_record.md
  evidence: docs/retrospective/2026-09-22_channel_single_writer_evidence.json
  limitations:
    - Live Cloudflare migration, exact-version traffic and production concurrency receipt are not yet verified.
    - No automatic repair of historical forks or legacy UNIQUE(key) schema.
    - Old direct-D1 writers must be quiesced and drained before cutover; no mixed-version writes.
    - Memory and Persona chains are outside this Channel repair.
