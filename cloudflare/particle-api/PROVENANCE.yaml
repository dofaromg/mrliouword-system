  - commit: 7f4f1e2
    change: R2 列表以附加方式加入分頁；indexR2 跨頁並改用 D1 批次寫入
    reason: Codex review #73/#74。既有 count/objects 欄位形狀不變，純附加
  - commit: 7f4f1e2
    change: 修正 sleep() 恆回 false 與 r2_count 恆為 1 兩個既存缺陷
    reason: v3.0.0 的正確性 bug，非本次引入，但沒有理由留著
  - commit: ebdb136
    change: 移除 channel_sync 的 key UNIQUE 約束並改為純 INSERT
    reason: >
      UNIQUE 搭配 INSERT OR REPLACE 會在同一個 key 二次 emit 時刪掉舊列，
      使 /channel/verify 永久回報斷鏈。改為 append 並取最新列，符合
      .mrliou/meta.json 的 history_policy: append_only —— 重新 emit 是
      追加一筆新事實，不是覆蓋舊事實。
  - commit: ebdb136
    change: syncKVtoD1 補上跨頁掃描與 cursor
    reason: 原本只取第一頁卻回報 success:true，與 R2 是同一類缺陷的另一半

