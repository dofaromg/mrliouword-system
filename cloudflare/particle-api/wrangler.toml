name = "particle-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV 快取層
[[kv_namespaces]]
binding = "MRLIOUWORD_VAULT"
id = "01275832766148bfbcaa00ee4aeb9946"

# D1 持久層
[[d1_databases]]
binding = "DB"
database_name = "mrliouword-db"
database_id = "7980baaf-48d3-43cc-8be7-dd8c9590f3d1"

# R2 檔案層
[[r2_buckets]]
binding = "PARTICLES"
bucket_name = "mrlioubook"

# 環境變數
[vars]
# MASTER_KEY 使用 wrangler secret put MASTER_KEY 設定

# PR #77 single-writer adapter: existing KV/D1/R2 bindings and routes stay intact.
# SQLite namespace is new; channel_sync history remains in the existing D1 DB.
[[durable_objects.bindings]]
name = "MRL_CHANNEL_CHAIN"
class_name = "Mrliou_ChannelChain"

[[migrations]]
tag = "mrliou-channel-chain-v1"
new_sqlite_classes = ["Mrliou_ChannelChain"]
