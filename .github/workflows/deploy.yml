name: Deploy MRL System and MrliouAI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Deploy MRL System Core
        working-directory: cloudflare/mrliouword-private
        run: |
          npm install
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  sync-notion:
    name: Sync to Notion
    runs-on: ubuntu-latest
    needs: deploy-cloudflare
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install notion-client
      
      - name: Sync particle dictionary
        working-directory: integrations/notion
        run: python sync.py --sync-dict
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  generate-docs:
    name: Generate Documentation
    needs: deploy-cloudflare
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate index
        env:
          MRL_DEPLOY_RESULT: ${{ needs.deploy-cloudflare.result }}
          MRL_SOURCE_SHA: ${{ github.sha }}
          MRL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/Mrliou_deployment_status.py \
            --result "$MRL_DEPLOY_RESULT" \
            --source-sha "$MRL_SOURCE_SHA" \
            --run-url "$MRL_RUN_URL"
      
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update system status"
          file_pattern: "docs/*.md"
