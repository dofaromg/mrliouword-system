name: Deploy MrLiouWord System

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-notion:
    name: Sync to Notion
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install notion-client
      
      - name: Sync particle dictionary
        working-directory: integrations/notion
        run: python sync.py --sync-dict
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate index
        run: |
          echo "# MrLiouWord System Status" > docs/STATUS.md
          echo "" >> docs/STATUS.md
          echo "Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> docs/STATUS.md
          echo "" >> docs/STATUS.md
          echo "## Deployed Components" >> docs/STATUS.md
          echo "- notion-sync: ✅" >> docs/STATUS.md
          echo "- particle-memory: ✅" >> docs/STATUS.md
      
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update system status"
          file_pattern: "docs/*.md"
